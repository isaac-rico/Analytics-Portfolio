version: 2

models:
  - name: mart_olist__sales__overview
    description: "Monthly sales performance including total sales, revenue, etc."
    columns:
      - name: order_purchase_month
        description: "Month when the order was placed"
      - name: total_orders
        description: "Total number of orders placed in the month"
      - name: total_revenue
        description: "Total revenue generated from orders in the month"
      - name: avg_order_value
        description: "Average value of orders placed in the month"

  - name: mart_olist__customer_experience
    description: "Customer experience metrics including average review scores and delivery performance"
    columns:
      - name: product_category_name
        description: "Category of the products ordered"
      - name: avg_review_score
        description: "Average review score for orders placed in the month"
      - name: review_count
        description: "Total number of reviews for orders placed in the month"
      - name: late_delivery_rate
        description: "Percentage of orders delivered late in the month"
      - name: avg_delivery_days
        description: "Average number of days between order purchase and delivery in the month"
      - name: total_orders
        description: "Total number of orders placed in the month"

  - name: mart_olist__fulfillment_performance
    description: "Fulfillment performance metrics including delivery times, late deliveries, freight costs, etc."
    columns:
      - name: order_purchase_month
        description: "Month when the order was placed"
      - name: avg_delivery_days
        description: "Average number of days between order purchase and delivery in the month"
      - name: late_delivery_rate
        description: "Percentage of orders delivered late in the month"

  - name: mart_olist__payment_behavior
    description: "Payment behavior metrics including payment types, installments, etc."
    columns:
      - name: order_purchase_month
        description: "Month when the order was placed"
      - name: payment_type_distribution
        description: "Distribution of payment types used for orders in the month"
      - name: avg_payment_installments
        description: "Average number of installments for payments in the month"